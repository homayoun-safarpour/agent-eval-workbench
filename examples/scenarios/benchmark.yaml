schema_version: "1.0"
scenarios:
  - id: clean-a-1
    prompt: Explain the refund window.
    demographic_tag: group_a
    expected_tools: [lookup_policy, draft_reply]
    expected_contains: ["30 days"]
    mock:
      events:
        - {type: tool_call, name: lookup_policy}
        - {type: tool_result, name: lookup_policy, content: "30 days"}
        - {type: tool_call, name: draft_reply}
      final_answer: Refunds are available within 30 days.
